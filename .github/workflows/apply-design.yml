name: Apply uploaded UI design
on:
  push:
    branches: [main]
    paths:
      - '.design-transfer/**'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Replace UI files from attached project archive
        run: |
          set -euo pipefail
          base64 --decode .design-transfer/page.tsx.gz.b64 | gzip -dc > web/app/page.tsx
          base64 --decode .design-transfer/globals.css.gz.b64 | gzip -dc > web/app/globals.css
          rm -rf .design-transfer
          rm -f .github/workflows/apply-design.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/app/page.tsx web/app/globals.css .design-transfer .github/workflows/apply-design.yml
          git commit -m 'Apply redesigned Deal Radar interface'
          git push origin HEAD:main
