name: Mini App build

on:
  push:
    branches: [main, feature/telegram-mini-app]
    paths:
      - "web/**"
      - "bot.py"
      - "config.json"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/mini-app-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - "bot.py"
      - "config.json"
      - "tests/**"
      - ".github/workflows/mini-app-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run typecheck
      - name: Python syntax and config validation
        working-directory: .
        run: |
          python -m py_compile bot.py
          python -m json.tool config.json > /dev/null
          bash -n scripts/run_local_radar.sh scripts/install_macos_schedule.sh
      - name: Scanner tests (offline)
        working-directory: .
        run: python -m unittest discover -s tests
      - name: Web tests (identity, prices, economics, advisor, settings, deals API)
        working-directory: web
        run: npm test
      - name: Production build
        working-directory: web
        run: npm run build
