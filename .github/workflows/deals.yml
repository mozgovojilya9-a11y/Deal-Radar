name: deals

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency: deals

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: state.db
          key: state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            state-${{ runner.os }}-
            state-
      - name: Restore the published feed
        run: |
          git fetch origin deals-data
          mkdir -p data
          git show origin/deals-data:data/deals.json > data/deals.json
      - name: Scan Marktplaats and update the JSON feed
        run: python bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Publish the feed to the data branch
        run: |
          set -euo pipefail
          FEED_WORKTREE="$(mktemp -d)"
          rmdir "$FEED_WORKTREE"
          git worktree add --detach "$FEED_WORKTREE" origin/deals-data
          mkdir -p "$FEED_WORKTREE/data"
          cp data/deals.json "$FEED_WORKTREE/data/deals.json"
          git -C "$FEED_WORKTREE" config user.name "github-actions[bot]"
          git -C "$FEED_WORKTREE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$FEED_WORKTREE" add data/deals.json
          if git -C "$FEED_WORKTREE" diff --cached --quiet; then
            echo "Deal feed did not change; skipping commit."
            exit 0
          fi
          git -C "$FEED_WORKTREE" commit -m "Update Deal Radar feed"
          git -C "$FEED_WORKTREE" push origin HEAD:refs/heads/deals-data
