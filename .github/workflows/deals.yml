name: deals

on:
  push:
    branches: [main]
    paths:
      - "bot.py"
      - "config.json"
      - "tests/**"
      - ".github/workflows/deals.yml"
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: deals
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: state.db
          key: state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            state-${{ runner.os }}-
            state-
      - name: Restore the published feed
        run: |
          set -euo pipefail
          mkdir -p data
          if git ls-remote --exit-code --heads origin deals-data > /dev/null 2>&1; then
            git fetch --depth=1 origin deals-data
            git show origin/deals-data:data/deals.json > data/deals.json || echo '{"updatedAt":null,"deals":[]}' > data/deals.json
          else
            echo "Branch deals-data does not exist yet; it will be created by the first run."
            echo '{"updatedAt":null,"deals":[]}' > data/deals.json
          fi
      - name: Run offline scanner tests
        run: python -m unittest discover -s tests -v
      - name: Scan Marktplaats and update the JSON feed (external web market research)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          AI_REVIEW_MAX_PER_QUERY: "4"
        run: python bot.py
      - name: Publish the feed to the deals-data branch
        run: |
          set -euo pipefail
          export GIT_AUTHOR_NAME="github-actions[bot]" GIT_COMMITTER_NAME="github-actions[bot]"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" GIT_COMMITTER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          blob="$(git hash-object -w data/deals.json)"
          data_tree="$(printf '100644 blob %s\tdeals.json\n' "$blob" | git mktree)"
          # Keep the Vercel branch-deployment guard in this feed-only branch too.
          # This prevents every 10-minute JSON update from consuming a Vercel deployment.
          vercel_config_blob="$(git hash-object -w web/vercel.json)"
          web_tree="$(printf '100644 blob %s\tvercel.json\n' "$vercel_config_blob" | git mktree)"
          root_tree="$(printf '040000 tree %s\tdata\n040000 tree %s\tweb\n' "$data_tree" "$web_tree" | git mktree)"
          commit="$(git commit-tree "$root_tree" -m "Update Deal Radar feed")"
          git push --force origin "$commit:refs/heads/deals-data"
